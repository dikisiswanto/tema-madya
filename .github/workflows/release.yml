name: Release Theme Madya

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${{ github.ref_name }}"

          echo "package.json version: $VERSION"
          echo "Git tag: $TAG"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: Git tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Run tests
        run: npm test

      - name: Build release
        run: npm run release

      - name: Verify release archive
        shell: bash
        run: |
          FILE="release/tema-madya-cms-sekolahku-v${VERSION}.zip"

          if [ ! -f "$FILE" ]; then
            echo "ERROR: Release archive not found: $FILE"
            exit 1
          fi

          echo "Release archive found: $FILE"

          echo "Top-level archive entries:"
          unzip -Z1 "$FILE" | awk -F/ 'NF { print $1 }' | sort -u

          TOP_LEVEL="$(unzip -Z1 "$FILE" | awk -F/ 'NF { print $1 }' | sort -u)"

          if [ "$TOP_LEVEL" != $'app\npublic' ]; then
            echo "ERROR: ZIP root must contain exactly app/ and public/"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          FILE="release/tema-madya-cms-sekolahku-v${VERSION}.zip"

          gh release create \
            "v${VERSION}" \
            "$FILE" \
            --title "Tema Madya v${VERSION}" \
            --generate-notes