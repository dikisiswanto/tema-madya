name: Release Theme Madya

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate tag against package.json
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${'{ github.ref_name }'}"

          if [ "$TAG" != "v$VERSION" ]; then
            echo "ERROR: Git tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test
        run: npm test

      - name: Build release
        run: npm run release

      - name: Verify archive
        shell: bash
        run: |
          FILE="tema-madya-cms-sekolahku-v${'{ env.VERSION }'}.zip"
          test -f "$FILE"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${'{ github.token }'}
        run: |
          FILE="tema-madya-cms-sekolahku-v${'{ env.VERSION }'}.zip"
          gh release create \
            "v${ env.VERSION }" \
            "$FILE" \
            --title "Tema Madya v${ env.VERSION }" \
            --generate-notes
