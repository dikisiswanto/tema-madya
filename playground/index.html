<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Pratinjau HTML-only Tema Madya CMS Sekolahku.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap">
    <link rel="icon" type="image/svg+xml" href="/theme-favicon.svg">
    <title>Madya — Pratinjau SekolahKu</title>
</head>
<body data-demo-source="/data/demo.json">
    <a href="#main-content" class="skip-link">Langsung ke konten utama</a>
    <div class="site-topbar" data-playground-topbar>
      <div class="theme-container topbar-inner">
        <div class="topbar-contact">
          <span data-demo-address></span>
          <a data-demo-phone></a>
          <a data-demo-email></a>
        </div>
        <div class="topbar-links">
          <a data-demo-spmb>PPDB 2025/2026</a><a href="/#programs">E-Learning</a><a href="/#profile">Portal Siswa</a>
          <a data-demo-social-facebook aria-label="Facebook"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3c-3.3 0-6 2.7-6 6v2H5v4h3v4h4v-4h3l1-4h-4v-2c0-1.1.9-2 2-2Z" fill="currentColor"/></svg></a><a data-demo-social-instagram aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg></a>
        </div>
      </div>
    </div>
    <header class="site-header" data-site-nav>
      <div class="theme-container madya-header-inner">
        <a class="brand" href="/" aria-label="Kembali ke beranda">
          <span class="brand-mark" aria-hidden="true"><span data-demo-logo-icon></span></span>
          <span class="brand-copy"><strong data-demo-site-name></strong><small data-demo-tagline></small></span>
        </a>
        <nav class="desktop-nav-wrap" aria-label="Navigasi utama"><ul class="desktop-nav" data-demo-navigation></ul></nav>
        <button class="header-search" type="button" data-search-open aria-haspopup="dialog" aria-controls="site-search-dialog" aria-label="Buka pencarian berita"><i data-lucide="search" aria-hidden="true"></i></button>
        <a class="nav-cta" data-demo-spmb-header>SPMB Online</a>
        <button class="mobile-toggle" type="button" data-mobile-menu aria-expanded="false" aria-controls="mobile-navigation"><span class="menu-icon" aria-hidden="true"><span></span><span></span></span><span class="sr-only">Buka menu</span></button>
      </div>
    </header>
    <aside id="mobile-navigation" class="mobile-nav" aria-label="Navigasi seluler" aria-hidden="true" inert>
      <div class="theme-container mobile-nav-inner">
        <div class="mobile-level" id="mobile-navigation-panel-root" data-mobile-level="root" data-active="true" aria-hidden="false"></div>
      </div>
    </aside>
    <div class="search-dialog" id="site-search-dialog" data-search-dialog hidden aria-hidden="true">
      <div class="search-dialog-backdrop" data-search-close></div>
      <section class="search-dialog-panel" role="dialog" aria-modal="true" aria-labelledby="site-search-title">
        <button class="search-dialog-close" type="button" data-search-close aria-label="Tutup pencarian"><i data-lucide="x" aria-hidden="true"></i></button>
        <p class="eyebrow">Pencarian</p><h2 id="site-search-title">Cari berita sekolah.</h2>
        <p class="search-dialog-copy">Masukkan kata kunci untuk menemukan berita yang relevan.</p>
        <form class="search-dialog-form" action="/news" method="get" data-search-form role="search">
          <label for="site-search-input" class="sr-only">Kata kunci berita</label><input id="site-search-input" name="search" type="search" placeholder="Cari berita…" autocomplete="off" enterkeyhint="search" required>
          <button class="button button-accent" type="submit"><i data-lucide="search" aria-hidden="true"></i><span>Cari Berita</span></button>
        </form><p class="search-dialog-hint">Hasil pencarian akan dibuka pada halaman Berita.</p>
      </section>
    </div>
    <main id="main-content" class="page-shell"><div data-spa-content data-spa-runtime="standalone"></div></main>
    <div id="playground-footer"></div>
    <script type="module" src="/app.js"></script>
</body>
</html>
